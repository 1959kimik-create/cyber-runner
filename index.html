<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Runner · 사이버 러너</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <section id="select-screen" class="screen">
      <p class="eyebrow">CYBER WORLD / CODING LANE</p>
      <h1>사이버 러너</h1>
      <p class="subtitle">바이러스를 피해 달려 데이터 조각을 모으세요</p>

      <nav class="main-tabs" aria-label="메인 메뉴">
        <button type="button" class="tab-btn is-active" data-main-tab="play">플레이</button>
        <button type="button" class="tab-btn" data-main-tab="settings">설정</button>
      </nav>

      <div class="card-row">
        <button type="button" class="char-card" data-character="bbia">
          <div class="sprite-frame">
            <img class="char-photo" src="assets/sprites/bbia/front/00.png" alt="삐아" />
          </div>
          <strong>삐아</strong>
          <span>AI 병아리 · 가벼운 발걸음</span>
          <ul class="char-traits">
            <li><span class="trait-label">체력</span> ♥ × 3</li>
            <li><span class="trait-label">피격</span> 범위 <em class="trait-small">S</em> (작음)</li>
          </ul>
        </button>
        <button type="button" class="char-card" data-character="oreu">
          <div class="sprite-frame">
            <img class="char-photo" src="assets/sprites/oreu/front/00.png" alt="오르" />
          </div>
          <strong>오르</strong>
          <span>AI 곰 · 든든한 러너</span>
          <ul class="char-traits">
            <li><span class="trait-label">체력</span> ♥ × 5</li>
            <li><span class="trait-label">피격</span> 범위 <em class="trait-large">L</em> (넓음)</li>
          </ul>
        </button>
      </div>

      <p class="hint" id="load-hint">캐릭터 불러오는 중...</p>
      <p class="hint hidden" id="play-hint">캐릭터를 선택하면 바로 달립니다</p>
    </section>

    <section id="settings-screen" class="screen hidden">
      <p class="eyebrow">SYSTEM / CONFIG</p>
      <h2>설정</h2>

      <nav class="main-tabs" id="settings-main-tabs" aria-label="메인 메뉴">
        <button type="button" class="tab-btn" data-main-tab="play">플레이</button>
        <button type="button" class="tab-btn is-active" data-main-tab="settings">설정</button>
      </nav>

      <button type="button" id="settings-resume-btn" class="btn primary hidden">게임으로 돌아가기</button>

      <div class="settings-panel">
        <h3>사운드</h3>
        <label class="setting-row">
          <span>배경음악</span>
          <input type="checkbox" id="bgm-enabled" checked />
        </label>
        <label class="setting-row">
          <span>배경음악 볼륨</span>
          <input type="range" id="bgm-volume" min="0" max="100" value="80" />
        </label>
        <label class="setting-row">
          <span>효과음</span>
          <input type="checkbox" id="sfx-enabled" checked />
        </label>
        <label class="setting-row">
          <span>효과음 볼륨</span>
          <input type="range" id="sfx-volume" min="0" max="100" value="80" />
        </label>

        <h3>키 조작</h3>
        <p class="settings-help">키 버튼을 누른 뒤 원하는 키를 입력하세요. Esc는 취소입니다.</p>
        <div class="keybind-row">
          <span>왼쪽 이동</span>
          <div class="key-slots">
            <button type="button" class="key-chip" data-action="left" data-slot="0"></button>
            <button type="button" class="key-chip" data-action="left" data-slot="1"></button>
          </div>
        </div>
        <div class="keybind-row">
          <span>오른쪽 이동</span>
          <div class="key-slots">
            <button type="button" class="key-chip" data-action="right" data-slot="0"></button>
            <button type="button" class="key-chip" data-action="right" data-slot="1"></button>
          </div>
        </div>
        <div class="keybind-row">
          <span>점프</span>
          <div class="key-slots">
            <button type="button" class="key-chip" data-action="jump" data-slot="0"></button>
            <button type="button" class="key-chip" data-action="jump" data-slot="1"></button>
          </div>
        </div>
        <button type="button" id="reset-keys-btn" class="btn">키 기본값</button>
      </div>
    </section>

    <section id="play-screen" class="screen hidden">
      <header class="hud">
        <div class="hud-lives" aria-label="목숨">
          <span class="hud-label">LIFE</span>
          <div id="hearts" class="hearts"></div>
        </div>
        <div class="hud-stat">
          <span class="hud-label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="hud-stat">
          <span class="hud-label">DISTANCE</span>
          <strong id="distance">0m</strong>
        </div>
        <button type="button" id="settings-btn" class="gear-btn" aria-label="설정">⚙</button>
      </header>
      <canvas id="game" width="480" height="720"></canvas>
      <p class="mobile-hint">화면을 좌우로 탭해 레인을 바꾸고, 위쪽을 탭하면 점프합니다</p>
    </section>

    <section id="over-screen" class="screen hidden">
      <p class="eyebrow">SYSTEM HALTED</p>
      <h2>게임 오버</h2>
      <p class="final-line">최종 점수 <strong id="final-score">0</strong></p>
      <p class="final-line muted">이동 거리 <span id="final-distance">0m</span></p>
      <div class="btn-row">
        <button type="button" id="retry-btn" class="btn primary">다시하기</button>
        <button type="button" id="home-btn" class="btn">캐릭터 선택</button>
      </div>
    </section>
  </div>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
